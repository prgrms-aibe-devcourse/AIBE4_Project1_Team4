<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>음식 추천 스무고개</title>
        <link rel="stylesheet" href="./css/index.css" />
    </head>
    <body>
        <div class="top-nav">
            <div class="logo-container">
                <span style="font-size: 0.9em; color: #999">로고 이미지</span>
            </div>
            <a href="navigation.html" class="nav-btn">네비게이션 바</a>
        </div>

        <div class="hero-section">
            <div class="hero-placeholder"></div>
            <div class="hero-content-wrapper">
                <div class="chat-box">
                    <div class="chat-header">
                        <!-- 챗봇 화면 -->
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div class="start-screen" id="startScreen">
                            <h2>안녕하세요! 👋</h2>
                            <p>
                                10가지 질문에 답변해주시면<br />
                                당신에게 딱 맞는 음식을 추천해드립니다!
                            </p>
                            <button class="btn btn-start" onclick="startGame()">
                                시작하기
                            </button>
                        </div>
                    </div>

                    <div
                        class="chat-input"
                        id="chatInput"
                        style="display: none"
                    >
                        <div class="button-group">
                            <button class="btn btn-yes" onclick="answer('예')">
                                예
                            </button>
                            <button
                                class="btn btn-no"
                                onclick="answer('아니오')"
                            >
                                아니오
                            </button>
                            <button
                                class="btn btn-maybe"
                                onclick="answer('상관없어요')"
                            >
                                상관없어요
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-section">
            <h2 class="section-title">당일치기 여행 추천지</h2>

            <div class="carousel-container">
                <button
                    class="carousel-arrow left"
                    onclick="scrollCarousel(-1)"
                >
                    ←
                </button>
                <div class="carousel-wrapper">
                    <div class="carousel-track" id="carouselTrack">
                        <div class="carousel-card">추천지 1</div>
                        <div class="carousel-card">추천지 2</div>
                        <div class="carousel-card">추천지 3</div>
                        <div class="carousel-card">추천지 4</div>
                        <div class="carousel-card">추천지 5</div>
                        <div class="carousel-card">추천지 6</div>
                    </div>
                </div>
                <button
                    class="carousel-arrow right"
                    onclick="scrollCarousel(1)"
                >
                    →
                </button>
            </div>
        </div>

        <script src="./js/index.js"></script>
    </body>
</html>
