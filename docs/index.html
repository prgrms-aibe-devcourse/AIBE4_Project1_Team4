<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>음식 추천 스무고개</title>
        <link rel="stylesheet" href="./css/index.css" />
    </head>
    <body>
        <div class="top-nav-container">
            <div class="top-nav">
                <div class="logo-container">
                    <span class="logo">
                        <a href="index.html">
                            <img src="./img/index-logo.png">
                        </a>
                    </span>
                </div>
                <div class="nav-box">
                    <a href="search.html" class="nav-btn">search</a>
                    <a href="schedule.html" class="nav-btn">schedule</a>
                    <a href="detail.html" class="nav-btn">detail</a>
                </div>
            </div>
        </div>

        <div class="hero-section">
            <div class="hero-placeholder"></div>
            <div class="hero-content-wrapper">
                <div class="chat-box">
                    <div class="chat-header">
                        <!-- 챗봇 화면 -->
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div class="start-screen" id="startScreen">
                            <h2>안녕하세요! 👋</h2>
                            <p>
                                10가지 질문에 답변해주시면<br />
                                당신에게 딱 맞는 음식을 추천해드립니다!
                            </p>
                            <button class="btn btn-start" onclick="startGame()">
                                시작하기
                            </button>
                        </div>
                    </div>

                    <div
                        class="chat-input"
                        id="chatInput"
                        style="display: none"
                    >
                        <div class="button-group">
                            <button class="btn btn-yes" onclick="answer('예')">
                                예
                            </button>
                            <button
                                class="btn btn-no"
                                onclick="answer('아니오')"
                            >
                                아니오
                            </button>
                            <button
                                class="btn btn-maybe"
                                onclick="answer('상관없어요')"
                            >
                                상관없어요
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-section">
            <div class="section-title-container">
                <h2 class="section-title">당일치기 여행 추천지</h2>
                <div class="arrow-container">
                    <button
                        class="carousel-arrow left"
                        onclick="scrollCarousel(1)"
                    >
                        &lt;
                    </button>
                    <button
                        class="carousel-arrow right"
                        onclick="scrollCarousel(-1)"
                    >
                        &gt;
                    </button>
                </div>
            </div>

            <div class="carousel-container">
                <div class="carousel-wrapper">
                    <div class="carousel-track" id="carouselTrack">
                        <div class="carousel-card">추천지 1</div>
                        <div class="carousel-card">추천지 2</div>
                        <div class="carousel-card">추천지 3</div>
                        <div class="carousel-card">추천지 4</div>
                    </div>
                </div>
            </div>
        </div>

        <script src="./js/index.js"></script>

        <template id="cardTemplate">
            <div class="carousel-card">
                <div class="card-content">
                    <h3 class="card-region"></h3>
                    <p class="card-date"></p>
                    <p class="card-meta"></p>
                    <p class="card-place"></p>
                </div>
            </div>
        </template>

        <template id="placeholderCardTemplate">
            <div class="carousel-card placeholder-card">
                <div class="card-content">
                    <h4>새로운 여행</h4>
                    <p>당일치기 여행을<br />계획해보세요!</p>
                </div>
            </div>
        </template>
    </body>
</html>
