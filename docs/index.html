<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>음식 추천 스무고개</title>
        <link rel="stylesheet" href="./css/index.css" />
    </head>
    <body>
        <div class="top-nav-container">
            <div class="top-nav">
                <div class="logo-container">
                    <span class="logo">
                        <a href="index.html">
                            <img src="./img/index-logo.png">
                        </a>
                    </span>
                </div>
                <div class="nav-box">
                    <a href="search.html" class="nav-btn">search</a>
                    <a href="schedule.html" class="nav-btn">schedule</a>
                    <a href="detail.html" class="nav-btn">detail</a>
                </div>
            </div>
        </div>

        <div class="hero-section">
            <div class="hero-placeholder"></div>
            <div class="hero-content-wrapper">
                <div class="chat-box">
                    <div class="chat-header">
                        <!-- 챗봇 화면 -->
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div class="start-screen" id="startScreen">
                            <h2>안녕하세요! 👋</h2>
                            <p>
                                10가지 질문에 답변해주시면<br />
                                당신에게 딱 맞는 음식을 추천해드립니다!
                            </p>
                            <button class="btn btn-start" onclick="startGame()">
                                시작하기
                            </button>
                        </div>
                    </div>

                    <div
                        class="chat-input"
                        id="chatInput"
                        style="display: none"
                    >
                        <div class="button-group">
                            <button class="btn btn-yes" onclick="answer('예')">
                                예
                            </button>
                            <button
                                class="btn btn-no"
                                onclick="answer('아니오')"
                            >
                                아니오
                            </button>
                            <button
                                class="btn btn-maybe"
                                onclick="answer('상관없어요')"
                            >
                                상관없어요
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-section">
            <div class="section-title-container">
                <h2 class="section-title">당일치기 여행 추천지</h2>
                <div class="arrow-container">
                    <button
                        class="carousel-arrow left"
                        onclick="scrollCarousel(1)"
                    >
                        &lt;
                    </button>
                    <button
                        class="carousel-arrow right"
                        onclick="scrollCarousel(-1)"
                    >
                        &gt;
                    </button>
                </div>
            </div>

            <div class="carousel-container">
                <div class="carousel-wrapper">
                    <div class="carousel-track" id="carouselTrack">
                        <div class="carousel-card">추천지 1</div>
                        <div class="carousel-card">추천지 2</div>
                        <div class="carousel-card">추천지 3</div>
                        <div class="carousel-card">추천지 4</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="footer-logo">Tripster.ai</div>
                    <p class="footer-meta-text">
                        [AIBE4] [Undefined] 1차 프로젝트<br />
                        식도락 여행 계획 추천 웹 서비스
                    </p>
                    <a
                        href="https://github.com/prgrms-aibe-devcourse/AIBE4_Project1_Team4"
                        target="_blank"
                        class="github-link"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            aria-hidden="true"
                            class="h-5 w-5"
                        >
                            <path
                                fill-rule="evenodd"
                                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.417 2.865 8.169 6.83 9.489.5.092.682-.217.682-.482 0-.237-.008-.874-.012-1.716-2.782.603-3.37-1.341-3.37-1.341-.454-1.157-1.11-1.465-1.11-1.465-.907-.619.068-.607.068-.607 1.002.07 1.53.94 1.53.94.887 1.523 2.33 1.082 2.895.828.09-.643.349-1.082.634-1.332-2.22-.252-4.555-1.109-4.555-4.936 0-1.089.387-1.984 1.025-2.683-.102-.253-.444-1.272.097-2.646 0 0 .84-.268 2.75 1.025.798-.222 1.649-.333 2.5-.333.85 0 1.701.111 2.5.333 1.91-1.293 2.75-1.025 2.75-1.025.54 1.374.198 2.393.097 2.646.64.699 1.025 1.594 1.025 2.683 0 3.835-2.338 4.681-4.563 4.936.36.31.68.919.68 1.854 0 1.334-.012 2.413-.012 2.743 0 .267.18.578.688.484C19.141 20.183 22 16.43 22 12.017 22 6.484 17.523 2 12 2z"
                                clip-rule="evenodd"
                            />
                        </svg>
                        GitHub 저장소
                    </a>
                </div>
                <div class="footer-right-section">
                    <div class="footer-section">
                        <h4 class="footer-heading">핵심 기능</h4>
                        <a href="search.html" class="footer-link"
                            >여행지 검색 (Search)</a
                        >
                        <a href="schedule.html" class="footer-link"
                            >일정 관리 (Schedule)</a
                        >
                        <a href="detail.html" class="footer-link"
                            >상세 정보 (Detail)</a
                        >
                        <a href="#" class="footer-link">음식 추천 챗봇</a>
                    </div>
    
                    <div class="footer-section">
                        <h4 class="footer-heading">프로젝트 정보</h4>
                        <a
                            href="https://www.notion.so/2793550b7b5581a3964adcc41b8e61f2?source=copy_link"
                            target="_blank"
                            class="footer-link"
                            >프로젝트 기획서</a
                        >
                        <a
                            href="https://www.notion.so/Undefined-4-2793550b7b5580f1aa57c7cad8fe44e5?source=copy_link"
                            target="_blank"
                            class="footer-link"
                            >팀 노션/위키</a
                        >
                        <a href="https://www.notion.so/Undefined-4-2793550b7b5580f1aa57c7cad8fe44e5?source=copy_link" class="footer-link">기술 스택</a>
                        <a href="https://www.notion.so/Undefined-4-2793550b7b5580f1aa57c7cad8fe44e5?source=copy_link" class="footer-link">개발 참여자 목록</a>
                    </div>
                </div>
                
            </div>
        </div>

        <script src="./js/index.js"></script>

        <template id="cardTemplate">
            <div class="carousel-card">
                <div class="card-content">
                    <h3 class="card-region"></h3>
                    <p class="card-date"></p>
                    <p class="card-meta"></p>
                    <p class="card-place"></p>
                </div>
            </div>
        </template>

        <template id="placeholderCardTemplate">
            <div class="carousel-card placeholder-card">
                <div class="card-content">
                    <h4>새로운 여행</h4>
                    <p>당일치기 여행을<br />계획해보세요!</p>
                </div>
            </div>
        </template>
    </body>
</html>
