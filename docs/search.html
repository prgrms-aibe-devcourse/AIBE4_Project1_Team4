<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 여행 계획 추천</title>
    <link rel="stylesheet" href="./css/search.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI 여행 계획 추천</h1>
        <p>여행 정보를 입력해주세요. AI가 맞춤 여행 계획을 추천해 드립니다.</p>
      </header>
      <div>
        <label for="regionInput">여행지:</label>
        <input id="regionInput" type="text" placeholder="어디로 떠나시나요?" />
        <label for="tripStartDate">여행 기간:</label>
        <input id="tripStartDate" type="date" /> ~
        <input id="tripEndDate" type="date" />
        <label for="peopleCountInput">인원:</label>
        <button id="decreaseBtn">-</button>
        <input
          id="peopleCountInput"
          class="people-count-input"
          type="text"
          value="1"
        />
        <button id="increaseBtn">+</button>
        <input id="sightCheckbox" type="checkbox" />
        <label for="sightCheckbox">식당 주변 관광명소 추천 받기</label>
        <button id="searchBtn">추천 받기</button>
      </div>
      <hr />
      <div id="loading" class="loading-indicator">
        <p>최적의 여행 계획 3가지를 생성 중입니다...</p>
      </div>

      <div id="suggestWrapper">
        <div class="plan-container">
          <div class="plan-title-wrapper">
            <h2 class="plan-title-header"></h2>
            <button class="details-btn">자세히 보기</button>
          </div>
          <div class="carousel-container">
            <button class="arrow-btn prev-btn">&lt;</button>
            <div class="slider-viewport">
              <div class="slider"></div>
            </div>
            <button class="arrow-btn next-btn">&gt;</button>
          </div>
          <div class="plan-summary-footer">
            <b>요약:</b> <span class="plan-summary-text"></span>
          </div>
        </div>
        <hr class="plan-divider" />
        <div class="plan-container">
          <div class="plan-title-wrapper">
            <h2 class="plan-title-header"></h2>
            <button class="details-btn">자세히 보기</button>
          </div>
          <div class="carousel-container">
            <button class="arrow-btn prev-btn">&lt;</button>
            <div class="slider-viewport">
              <div class="slider"></div>
            </div>
            <button class="arrow-btn next-btn">&gt;</button>
          </div>
          <div class="plan-summary-footer">
            <b>요약:</b> <span class="plan-summary-text"></span>
          </div>
        </div>
        <hr class="plan-divider" />
        <div class="plan-container">
          <div class="plan-title-wrapper">
            <h2 class="plan-title-header"></h2>
            <button class="details-btn">자세히 보기</button>
          </div>
          <div class="carousel-container">
            <button class="arrow-btn prev-btn">&lt;</button>
            <div class="slider-viewport">
              <div class="slider"></div>
            </div>
            <button class="arrow-btn next-btn">&gt;</button>
          </div>
          <div class="plan-summary-footer">
            <b>요약:</b> <span class="plan-summary-text"></span>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/search.js"></script>
  </body>
</html>
