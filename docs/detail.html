<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>여행계획 리뷰</title>
    <link rel="stylesheet" href="css/detail.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-50">
    <div class="container">
      <h1 class="text-3xl font-bold mb-8 p-2">여행 계획</h1>

      <!-- 여행 계획 카드 -->
      <div class="plan-grid" id="planGrid">
        <!-- js로 동적으로 여행 카드 생성 -->
      </div>
    </div>

    <div class="modal-body p-5 bg-white shadow-md rounded-lg mt-8 hidden">
      <div class="form-group mb-4">
        <label class="form-label block text-sm font-medium text-gray-700 mb-1">
          평점을 선택해주세요
        </label>
        <div
          class="review-rating flex justify-center space-x-1"
          id="reviewRating"
        >
          <!-- 별 아이콘 나중에 이미지로 수정 예정 -->
          <span class="star" data-rating="1">★</span>
          <span class="star" data-rating="2">★</span>
          <span class="star" data-rating="3">★</span>
          <span class="star" data-rating="4">★</span>
          <span class="star" data-rating="5">★</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label block text-sm font-medium text-gray-700 mb-1">
          리뷰 내용 </label
        ><br />
        <textarea
          class="form-textarea w-full p-3 border border-gray-300 rounded-lg shadow-sm"
          id="reviewContent"
          placeholder="여행은 어떠셨나요? 솔직한 후기를 남겨주세요!"
        ></textarea>
      </div>
    </div>
    <script src="js/detail.js"></script>
  </body>
</html>
