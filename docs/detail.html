<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>여행계획 리뷰</title>
    <link rel="stylesheet" href="css/index.css" />

    <link rel="stylesheet" href="css/detail.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="top-nav-container">
      <div class="top-nav">
        <div class="logo-container">
          <span class="logo">
            <a href="index.html">
              <img src="./img/index-logo.png" />
            </a>
          </span>
        </div>
        <div class="nav-box">
          <a href="search.html" class="nav-btn">search</a>
          <a href="schedule.html" class="nav-btn">schedule</a>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="plan-grid" id="planGrid"></div>
    </div>

    <div id="reviewsListModalContainer" class="hidden">
      <div class="modal-body review-list-body">
        <h2 class="modal-title">
          <span id="reviewsTitlePlanName"></span> 리뷰 목록
        </h2>

        <button id="closeReviewsListModalButton">닫기</button>

        <div id="reviewsList" class="reviews-list-container"></div>

        <div id="noReviewsMessage" class="no-reviews-message hidden">
          아직 작성된 리뷰가 없습니다.
        </div>
      </div>
    </div>

    <div id="reviewModalContainer" class="hidden">
      <div class="modal-body">
        <h2 class="modal-title">리뷰 작성</h2>

        <button id="closeModalButton">닫기</button>

        <div class="form-group">
          <label class="form-label">평점을 선택해주세요</label>

          <div class="review-rating" id="reviewRating">
            <img
              src="img/icon/icon-fork-gray.png"
              class="star"
              data-rating="1"
              alt="1점"
            />
            <img
              src="img/icon/icon-fork-gray.png"
              class="star"
              data-rating="2"
              alt="2점"
            />
            <img
              src="img/icon/icon-fork-gray.png"
              class="star"
              data-rating="3"
              alt="3점"
            />
            <img
              src="img/icon/icon-fork-gray.png"
              class="star"
              data-rating="4"
              alt="4점"
            />
            <img
              src="img/icon/icon-fork-gray.png"
              class="star"
              data-rating="5"
              alt="5점"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">리뷰 내용</label><br />

          <textarea
            class="form-textarea"
            id="reviewContent"
            rows="4"
            placeholder="여행은 어떠셨나요? 솔직한 후기를 남겨주세요!"
          ></textarea>
        </div>

        <button id="submitReviewButton">리뷰 저장</button>
      </div>
    </div>
    <script src="js/detail.js"></script>
  </body>
</html>
